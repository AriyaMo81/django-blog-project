{% extends "base.html" %}

{% block title %}
    Todo List
{% endblock title %}

{% block content %}

<div class="container mt-4">

    <h4 class="mb-3">Todo List</h4>

    <div class="list-group">
        {% for todo in todos %}
            <a href="{% url 'detail' todo.id %}"
               class="list-group-item list-group-item-action">
                {{ todo.title }}
            </a>
        {% empty %}
            <p class="text-muted">هنوز کاری اضافه نکردی!</p>
        {% endfor %}
    </div>

</div>

{% endblock content %}
